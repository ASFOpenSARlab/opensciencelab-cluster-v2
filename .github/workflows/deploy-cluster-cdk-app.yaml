---
# yamllint disable rule:line-length
name: Deploy Cluster CDK
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      jupyterhub-image-tag:
        description: "image tag of `opensciencelab-jupyterhub` (ex. 'dp', 'v1.0.2', etc.)"
        required: false
        default: test

      execwhacker-image-tag:
        description: "image tag of `opensciencelab-update-execwhacker` (ex. 'dp', 'v1.0.2', etc.)"
        required: false
        default: test

      envOverride:
        description: "Environment override / Lab short name"
        type: environment
        default: test

      runTestSuite:
        description: "Run test suite on build. Note that Test always runs tests."
        type: boolean
        default: false

  push:
    branches:
      - main

jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@v1.2.1
    with:
      tagname: ${{ inputs.tagname || github.ref_name }}

  build-and-deploy-cluster:
    runs-on: ubuntu-latest
    needs:
      - setup
    environment: ${{ inputs.envOverride || needs.setup.outputs.environment }}
    container: ghcr.io/asfopensarlab/osl-utils:v1.2.1
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_PREFIX: ${{ needs.setup.outputs.deploy_prefix }}
      JUPYTER_HUB_DOCKER_TAG: ${{ github.event.inputs.jupyterhub-image-tag || needs.setup.outputs.deploy_prefix }}
      EXECWHACKER_CRON_DOCKER_TAG: ${{ github.event.inputs.execwhacker-image-tag || needs.setup.outputs.deploy_prefix }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      UI_IAM_USER: ${{ vars.UI_IAM_USER }}
      ADMIN_USERS: ${{ vars.ADMIN_USERS }}
      PORTAL_DOMAINS: ${{ vars.PORTAL_DOMAINS }}
      ALLOWED_LAB_PROFILES: ${{ vars.ALLOWED_LAB_PROFILES }}
      LAB_SHORT_NAME: ${{ inputs.envOverride || needs.setup.outputs.environment }}
      VOLUME_CRON_SCHEDULE: ${{ vars.VOLUME_CRON_SCHEDULE }}
      SNAPSHOT_WARNING_DAYS: ${{ vars.SNAPSHOT_WARNING_DAYS }}
    steps:
      - name: Log Environment
        run: |
          echo Selected Environment: ${{ inputs.envOverride || needs.setup.outputs.environment }}

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_NUMBER }}:role/deploy_cluster_stack_role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Run Cluster Testsuite
        if: contains(fromJSON('["test"]'), inputs.envOverride || needs.setup.outputs.environment ) || inputs.runTestSuite == true
        run: |
          make test

      - name: CDK Deploy Cluster
        run: |-
          make deploy-cluster
