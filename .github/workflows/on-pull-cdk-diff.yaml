---
name: Document CDK Diff for pull request
on: # yamllint disable-line rule:truthy
  workflow_dispatch: {}
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, review_requested]
    branches:
      - main

permissions:
   contents: read

jobs:

  cdk-diff:
    runs-on: ubuntu-latest
    environment: test
    container: ghcr.io/asfopensarlab/osl-utils:v1.2.1
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    env:
      LAB_SHORT_NAME: test
      PROFILE_DEFINITIONS: ${{ vars.PROFILE_DEFINITIONS }}
      NODE_DEFINITIONS: ${{ vars.NODE_DEFINITIONS }}
      JUPYTER_HUB_IMAGE_PATH: ${{ vars.JUPYTER_HUB_IMAGE_PATH }}
      JUPYTER_HUB_IMAGE_TAG: ${{ vars.JUPYTER_HUB_IMAGE_TAG }}
      CRYPTNONO_ALERT_EMAIL: ${{ vars.CRYPTNONO_ALERT_EMAIL }}
      EXECWHACKER_CRON_IMAGE_PATH: ${{ vars.EXECWHACKER_CRON_IMAGE_PATH }}
      EXECWHACKER_CRON_IMAGE_TAG: ${{ vars.EXECWHACKER_CRON_IMAGE_TAG }}
      IS_CRYPTNONO_ENABLED: ${{ vars.IS_CRYPTNONO_ENABLED }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      UI_IAM_ROLE: ${{ vars.UI_IAM_ROLE }}
      ADMIN_USERS: ${{ vars.ADMIN_USERS }}
      PORTAL_DOMAINS: ${{ vars.PORTAL_DOMAINS }}
      VOLUME_CRON_SCHEDULE: ${{ vars.VOLUME_CRON_SCHEDULE }}
      SNAPSHOT_WARNING_DAYS: ${{ vars.SNAPSHOT_WARNING_DAYS }}
      SNAPSHOT_GRACEPERIOD_DAYS: ${{ vars.SNAPSHOT_GRACEPERIOD_DAYS }}
      DAYS_TILL_SNAPSHOT_DELETION: ${{ vars.DAYS_TILL_SNAPSHOT_DELETION }}
      DAYS_TILL_VOLUME_DELETION: ${{ vars.DAYS_TILL_VOLUME_DELETION }}
      AZ_LETTER: ${{ vars.AZ_LETTER }}
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_NUMBER }}:role/deploy_cluster_stack_role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Run Diff
        run: |-
          cd ./cluster-cdk
          cdk diff 2>&1 | tee ../cdk-diff-output.log

      - name: Upload Diff Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cdk-diff-artifact
          path: cdk-diff-output.log
          retention-days: 10

  # Run as a separate job so token permissions don't propagate
  comment-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs:
      - cdk-diff
    steps:

      - name: Download Diff Artifact
        uses: actions/download-artifact@v8
        with:
          name: cdk-diff-artifact

      - name: Comment CDK Diff Output on PR
        uses: towardsthecloud/aws-cdk-diff-pr-commenter@v1
        with:
          diff-file: cdk-diff-output.log
